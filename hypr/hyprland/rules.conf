# Xwaylandpopup tags
windowrule = tag +xwaylandpopup, match:title ^(wpp|wps|pdf|et)$, match:class ^(wpp|wps|pdf|et)$, match:xwayland 1
windowrule = tag +xwaylandpopup, match:xwayland 1, match:title win[0-9]+
windowrule = tag +xwaylandpopup, match:xwayland 1, match:title ^(\s*)$
windowrule = tag +xwaylandpopup, match:xwayland 1, match:title ^([Oo][Nn][Ll][Yy][Oo][Ff][Ff][Ii][Cc][Ee])$, match:class ^([Oo][Nn][Ll][Yy][Oo][Ff][Ff][Ii][Cc][Ee])$, match:float on

# Office Suite Tags
windowrule = tag +office, match:class ^(libreoffice|libreoffice-base|libreoffice-calc|libreoffice-writer|libreoffice-impress)$
windowrule = tag +office, match:class ^([Oo][Nn][Ll][Yy][Oo][Ff][Ff][Ii][Cc][Ee])$

# Tooltip tags
windowrule = tag +tooltip, match:class ^(com-eteks-sweethome3d-SweetHome3D)$, match:title ^(win1)$

# Utility Tags
windowrule = tag +utility, match:class ^(localsend)$
windowrule = tag +utility, match:class ^(better_control\.py)$
windowrule = tag +utility, match:class ^(xdg-desktop-portal-.*)$
windowrule = tag +utility, match:class ^(org\.freedesktop\.impl\.portal\.desktop.*)$
windowrule = tag +utility, match:class ^(nwg-displays)$

# email tags
windowrule = tag +email, match:class ^([Tt]hunderbird|org.gnome.Evolution)$
windowrule = tag +email, match:class ^(eu.betterbird.Betterbird)$
windowrule = tag +email, match:class ^([Bb]lue[Mm]ail)$

# Picture in Picture tags
windowrule = tag +pip, match:title Picture(-| )in(-| )[Pp]icture
windowrule = tag +pip, match:initial_title ^([Dd]iscord [Pp]opout)$

# ######## Window rules ########
windowrule = opacity $windowOpacity override, match:fullscreen false

windowrule = opaque on, match:class foot|equibop|org\.quickshell|imv|swappy  # They use native transparency or we want them opaque
windowrule = center 1, match:float false, match:xwayland false  # Center all floating windows (not xwayland cause popups)

# Utility
windowrule = float on, match:tag utility*
windowrule = center 1, match:tag utility*
windowrule = size monitor_w*0.60 monitor_h*0.70, match:tag utility*

# Float
windowrule = float on, match:class guifetch  # FlafyDev/guifetch
windowrule = float on, match:class yad
windowrule = float on, match:class zenity
windowrule = float on, match:class wev
windowrule = float on, match:class org\.gnome\.FileRoller
windowrule = float on, match:class file-roller  # WHY IS THERE TWOOOOOOOOOOOOOOOO
windowrule = float on, match:class blueman-manager
windowrule = float on, match:class com\.github\.GradienceTeam\.Gradience
windowrule = float on, match:class feh
windowrule = float on, match:class imv
windowrule = float on, match:class system-config-printer
windowrule = float on, match:class org\.quickshell
windowrule = float on, match:class guvcview, match:title [Gg]uvcview
windowrule = float on, match:class ^(net\.code-industry\.masterpdfeditor4)$, match:title ^([Aa]ction)$

# Float, resize and center
windowrule = float on, match:class foot, match:title nmtui
windowrule = size monitor_w*0.60 monitor_h*0.70, match:class foot, match:title nmtui
windowrule = center 1, match:class foot, match:title nmtui
windowrule = float on, match:class org\.gnome\.Settings
windowrule = size monitor_w*0.70 monitor_h*0.80, match:class org\.gnome\.Settings
windowrule = center 1, match:class org\.gnome\.Settings
windowrule = float on, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser
windowrule = size monitor_w*0.60 monitor_h*0.70, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser
windowrule = center 1, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser
windowrule = float on, match:class nwg-look
windowrule = size monitor_w*0.50 monitor_h*0.60, match:class nwg-look
windowrule = center 1, match:class nwg-look

# Special workspaces
windowrule = workspace special:sysmon, match:class btop
windowrule = workspace special:music, match:class feishin|Spotify|Supersonic|Cider
windowrule = workspace special:music, match:initial_title Spotify( Free)?  # Spotify wayland, it has no class for some reason
windowrule = workspace special:communication, match:class discord|equibop|vesktop|whatsapp|ferdium
windowrule = workspace special:todo, match:class Todoist

# Dialogs
windowrule = float on, match:title (Select|Open)( a)? (File|Folder)(s)?
windowrule = float on, match:title File (Operation|Upload)( Progress)?
windowrule = float on, match:title .* Properties
windowrule = float on, match:title Export Image as PNG
windowrule = float on, match:title GIMP Crash Debug
windowrule = float on, match:title Save As
windowrule = float on, match:title Library
windowrule = float on, match:title Rename .*

# Picture in picture
windowrule = size monitor_w*0.25 monitor_h*0.3, match:tag pip*
windowrule = move (monitor_w-window_w-(monitor_w*0.005)) monitor_h*0.05, match:tag pip*  # Initial move so window doesn't shoot across the screen from the center
windowrule = keep_aspect_ratio on, match:tag pip*
windowrule = float on, match:tag pip*
windowrule = pin on, match:tag pip*

# Steam
windowrule = rounding 10, match:title '', match:class steam
windowrule = float on, match:title Friends List, match:class steam
windowrule = immediate on, match:class steam_app_[0-9]+  # Allow tearing for steam games
windowrule = immediate on, match:class gamescope*  # Allow tearing for steam games
windowrule = idle_inhibit always, match:class steam_app_[0-9]+  # Always idle inhibit when playing a steam game
windowrule = idle_inhibit always, match:class gamescope*  # Always idle inhibit when playing a steam game
windowrule = fullscreen on, match:class steam_app_[0-9]+  # Always idle inhibit when playing a steam game
windowrule = fullscreen on, match:class gamescope*  # Always idle inhibit when playing a steam game

# ATLauncher console
windowrule = float on, match:class com-atlauncher-App, match:title ATLauncher Console

# Autodesk Fusion 360
windowrule = no_blur on, match:title Fusion360|(Marking Menu), match:class fusion360\.exe
windowrule = no_blur on, match:class ^([Gg]romit-mpx)$

# Ugh xwayland popups
windowrule = no_dim on, match:tag xwaylandpopup*
windowrule = no_shadow on, match:tag xwaylandpopup*
windowrule = rounding 10, match:tag xwaylandpopup*
windowrule = no_blur on, match:tag xwaylandpopup*
windowrule = decorate off, match:tag xwaylandpopup*

# ######## Workspace rules ########
workspace = w[tv1]s[false], gapsout:$singleWindowGapsOut
workspace = f[1]s[false], gapsout:$singleWindowGapsOut

# ######## Layer rules ########
layerrule = animation fade, match:namespace hyprpicker  # Colour picker out animation
layerrule = animation fade, match:namespace logout_dialog  # wlogout
layerrule = animation fade, match:namespace selection  # slurp
layerrule = animation fade, match:namespace wayfreeze

# Fuzzel
layerrule = animation popin 80%, match:namespace launcher
layerrule = blur on, match:namespace launcher

# Float
windowrule = float on, match:class ([Zz]oom|onedriver|onedriver-launcher|[Oo]ne[Dd]rive[Gg][Uu][Ii])$
windowrule = persistent_size on, match:class ([Zz]oom|onedriver|onedriver-launcher|[Oo]ne[Dd]rive[Gg][Uu][Ii])$

windowrule = float on, match:class ^(com.nextcloud.desktopclient.nextcloud)$
windowrule = size monitor_w*0.3 monitor_h*0.7, match:class ^(com.nextcloud.desktopclient.nextcloud)$
windowrule = no_initial_focus on, match:class ^(com.nextcloud.desktopclient.nextcloud)$

windowrule = float on, match:class (org.gnome.Calculator), match:title (Calculator)
windowrule = float on, match:class ^([Qq]alculate-gtk)$
windowrule = persistent_size on, match:class ^([Qq]alculate-gtk)$

windowrule = float on, match:class ^([Zz]otero)$, match:initial_title negative:^([Zz]otero)$
windowrule = suppress_event maximize, match:class ^([Zz]otero)$, match:initial_title negative:^([Zz]otero)$
windowrule = size monitor_w*0.70 monitor_h*0.30, match:class ^([Zz]otero)$, match:title ^([Cc]itation [Dd]ialog)$
windowrule = size monitor_w*0.70 monitor_h*0.30, match:class ^([Zz]otero)$, match:title ^([Ee]dit [Bb]ibliography)$

windowrule = float on, match:class ^(org.inkscape.Inkscape)$, match:initial_title negative:^(org.inkscape.Inkscape)$
windowrule = float on, match:title ^(Add Folder to Workspace)$
windowrule = size monitor_w*0.70 monitor_h*0.60, match:title ^(Add Folder to Workspace)$
windowrule = center on, match:title ^(Add Folder to Workspace)$
windowrule = float on, match:initial_title (Open Files)
windowrule = size monitor_w*0.70 monitor_h*0.60, match:initial_title (Open Files)
windowrule = float on, match:class ^(com.vixalien.sticky)$
windowrule = size monitor_w*0.20 monitor_h*0.50, match:class ^(com.vixalien.sticky)$
windowrule = pin on, match:class ^(com.vixalien.sticky)$, match:title negative:^([Ss]ticky [Nn]otes)$

windowrule = float on, match:class ^([Ee]mulator)$

# Hide
windowrule = workspace special:trash silent, match:tag hide*

# Tile
windowrule = tile on, match:class ^(emu8086\.exe)$ match:title ^(emu8086 - assembler and microprocessor emulator.*)$
windowrule = tile on, match:class ^(com-cburch-logisim-[Mm]ain)$, match:title ^(main of.*)$

# Email
windowrule = workspace special:email, match:tag email*

# WPS Popups
windowrule = float on, match:title ^(wpp|wps|pdf|et)$, match:class ^(wpp|wps|pdf|et)$, match:xwayland 1

# Office Suite
windowrule = maximize 1, match:tag office*
windowrule = maximize 1, match:class ^([Vv]sim)$
windowrule = maximize 1, match:class ^(quartus)$, match:title ^([Pp]in [Pp]lanner.*)$
